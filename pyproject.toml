[project]
name = "pagezy-analyst-bot"
version = "0.1.0"
description = "Pagezy content & competitor analyst Telegram bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]>=21.6",
    "telethon>=1.36.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "google-api-python-client>=2.140.0",
    "instaloader>=4.13.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.2.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "apscheduler>=3.10.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
pagezy-bot = "pagezy_bot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]