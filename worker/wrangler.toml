name = "pagezy-analyst-bot"
main = "src/index.ts"
compatibility_date = "2025-11-19"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "MTPROTO", class_name = "MtprotoCollector" },
  { name = "PAGEZY_STORE", class_name = "PagezyStore" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MtprotoCollector", "PagezyStore"]

[observability]
enabled = true

[observability.traces]
enabled = true

[[kv_namespaces]]
binding = "CACHE"
id = "0b0f298df8ea4cefa5248cc5e2c24da7"

[triggers]
crons = ["0 */2 * * *"]

[vars]
MOCK_MODE = "false"
ZERNIO_INSTAGRAM_ACCOUNT_ID = "6af6e7b664a67632e57fced8"

# Secrets: TELEGRAM_BOT_TOKEN, ALLOWED_USER_IDS, OPENROUTER_API_KEY, ZERNIO_API_KEY,
# YOUTUBE_API_KEY, TG_API_ID, TG_API_HASH, TG_SESSION_STRING, optional META_*